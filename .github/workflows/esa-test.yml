name: ESA offline tests
on:
  pull_request:
  push:
    branches: ['feat/esa-*']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10.17'
      - run: python -m pip install uv==0.6.16
      - run: uv pip install --system --require-hashes -r src/esa-certbot/requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_legacy.cjs
      - run: python tools/build_esa.py
      - name: Check reproducible archive
        run: |
          cp build/esa/fc-certbot-esa.zip /tmp/first.zip
          python tools/build_esa.py --reuse-deps
          cmp /tmp/first.zip build/esa/fc-certbot-esa.zip
